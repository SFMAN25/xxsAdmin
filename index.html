<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>XXSB | لوحة التحكم الشاملة لايف</title>
    <style>
        body { background-color: #060913; color: #e2e8f0; font-family: 'Segoe UI', sans-serif; padding: 20px; }
        .panel { max-width: 1100px; margin: 0 auto; background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        h2 { text-align: center; color: #00ffcc; text-shadow: 0 0 10px rgba(0,255,204,0.3); }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; font-size: 14px; text-align: center; }
        th, td { padding: 12px; border: 1px solid #1e293b; }
        th { background: #1e293b; color: #00ffcc; }
        tr:nth-child(even) { background: #131d31; }
        .control-box { background: #131a26; padding: 20px; border-radius: 10px; margin-top: 30px; border: 1px solid #ffcc00; display: flex; flex-wrap: wrap; justify-content: space-around; align-items: center; }
        input { padding: 10px; background: #060913; border: 1px solid #1e293b; color: #fff; border-radius: 6px; text-align: center; margin: 5px; width: 220px; }
        .btn-action { padding: 10px 25px; background: #ffcc00; color: #000; font-weight: bold; border: none; border-radius: 6px; cursor: pointer; }
        .btn-action:hover { background: #cca300; }
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold; background: #1e293b; color: #00ffcc; }
    </style>
</head>
<body>

    <div class="panel">
        <h2>📊 لوحة تحكم وإدارة منصة XXSB اللايف</h2>
        <hr style="border-color: #1e293b;">

        <h3>👥 الحسابات المسجلة وبيانات الأجهزة والشبكات:</h3>
        <table>
            <thead>
                <tr>
                    <th>البريد الإلكتروني</th>
                    <th>الرصيد الحالي</th>
                    <th>كود الإحالة الخاص</th>
                    <th>عنوان الـ IP</th>
                    <th>مزود الشبكة</th>
                    <th>نوع جهاز اللاعب</th>
                </tr>
            </thead>
            <tbody id="users-table-body">
                </tbody>
        </table>

        <div class="control-box">
            <h3 style="width: 100%; margin-top: 0; color: #ffcc00; text-align: center;">💰 التحكم المالي السريع (إرسال / سحب رصيد يدوي)</h3>
            <input type="email" id="target-email" placeholder="اكتب إيميل اللاعب بدقة">
            <input type="number" id="target-amount" placeholder="المبلغ (مثال: 500 أو -500 للخصم)">
            <button class="btn-action" id="btn-update-balance">تنفيذ الأمر المالي فوراً</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
        import { getFirestore, collection, onSnapshot, query, where, getDocs, updateDoc, doc, increment } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

        // الـ Config الخاص بمشروعك xxsb-6bd79
        const firebaseConfig = {
            apiKey: "ضع_هنا_الـ_API_KEY_الخاص_بك",
            authDomain: "xxsb-6bd79.firebaseapp.com",
            projectId: "xxsb-6bd79",
            storageBucket: "xxsb-6bd79.appspot.com",
            messagingSenderId: "ضع_هنا_الـ_SENDER_ID",
            appId: "ضع_هنا_الـ_APP_ID"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // تشغيل صوت التنبيه القصير عند تسجيل لاعب جديد بالمنصة
        let initialLoad = true;
        const alertSound = new Audio('https://actions.google.com/sounds/v1/notifications/beep_short.ogg');

        // جلب وعرض بيانات المستخدمين + الأجهزة والشبكات لايف وتحديثها تلقائياً
        onSnapshot(collection(db, "users"), (snapshot) => {
            const tableBody = document.getElementById('users-table-body');
            tableBody.innerHTML = ""; // مسح القديم للتحديث

            // إطلاق التنبيه الصوتي لو مسجل جديد دخل واللوحة مفتوحة
            if (!snapshot.empty && !initialLoad) {
                alertSound.play().catch(e => console.log("الصوت يحتاج تفاعل مع الصفحة أولاً"));
            }
            initialLoad = false;

            snapshot.forEach((userDoc) => {
                const u = userDoc.data();
                const row = document.createElement('tr');
                
                row.innerHTML = `
                    <td><b>${u.email || 'غير متاح'}</b></td>
                    <td style="color: #ffcc00; font-weight: bold;">${u.balance || 0} ج.م</td>
                    <td><span class="badge">${u.referralCode || '-'}</span></td>
                    <td style="color: #00ffcc;">${u.ipAddress || 'مخفي'}</td>
                    <td>${u.networkProvider || 'فودافون/اتصالات/WE'}</td>
                    <td>${u.deviceType || 'موبايل'}</td>
                `;
                tableBody.appendChild(row);
            });
        });

        // تفعيل زرار الإرسال والخصم المالي الفوري عن طريق الإيميل
        document.getElementById('btn-update-balance').addEventListener('click', async () => {
            const email = document.getElementById('target-email').value.trim();
            const amount = parseInt(document.getElementById('target-amount').value);

            if(!email || isNaN(amount)) return alert("يرجى إدخال إيميل اللاعب والمبلغ بشكل صحيح!");

            try {
                const q = query(collection(db, "users"), where("email", "==", email));
                const querySnap = await getDocs(q);

                if(querySnap.empty) {
                    alert("اللاعب غير موجود بالداتابيز! تأكد من الإيميل.");
                    return;
                }

                const userDocId = querySnap.docs[0].id;
                // تعديل الرصيد بالزيادة أو النقصان باستخدام التحديث التراكمي
                await updateDoc(doc(db, "users", userDocId), {
                    balance: increment(amount)
                });

                alert(`تم تنفيذ العملية بنجاح وتعديل رصيد اللاعب بقيمة ${amount} ج.م!`);
                document.getElementById('target-amount').value = "";
            } catch (err) {
                alert("حدث خطأ أثناء العملية: " + err.message);
            }
        });
    </script>
</body>
</html>
